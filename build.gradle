plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${mod_version}-forge-${minecraft_version}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}


// JEI / EMI / REI are optional runtime integrations. Minimal compile-only API stubs
// live in separate source sets so this project can still be built completely offline.
// Their classes are compile inputs only and are never packaged into the mod JAR.
sourceSets {
    jeiStubs { java.srcDir 'src/jeiStubs/java' }
    emiStubs { java.srcDir 'src/emiStubs/java' }
    reiStubs { java.srcDir 'src/reiStubs/java' }
}
sourceSets.jeiStubs.compileClasspath += configurations.compileClasspath
sourceSets.emiStubs.compileClasspath += configurations.compileClasspath
sourceSets.reiStubs.compileClasspath += configurations.compileClasspath
sourceSets.main.compileClasspath += sourceSets.jeiStubs.output
sourceSets.main.compileClasspath += sourceSets.emiStubs.output
sourceSets.main.compileClasspath += sourceSets.reiStubs.output
compileJava.dependsOn compileJeiStubsJava, compileEmiStubsJava, compileReiStubsJava

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                glitchedcrown {
                    source sourceSets.main
                }
            }
        }

        client {}
        server {
            args '--nogui'
        }
    }
}

repositories {
    maven { url = 'https://maven.theillusivec4.top/' }
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://maven.shedaniel.me/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // This mod mixes into Curios' internal DynamicStackHandler, so the full
    // Curios implementation JAR must be present on compileClasspath.  The API
    // classifier alone does not contain top.theillusivec4.curios.common.*.
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Optional developer-only runtime profiles. Example:
    //   gradlew runClient -PcompatViewer=jei
    // ForgeGradle remaps these production JARs for the official-mapped dev runtime.
    // They are runtime inputs only and are never embedded in The Crowns' JAR.
    def compatViewer = providers.gradleProperty('compatViewer').getOrElse('none')
    if (compatViewer == 'jei') {
        runtimeOnly fg.deobf('mezz.jei:jei-1.20.1-forge:15.20.0.110')
    } else if (compatViewer == 'emi') {
        runtimeOnly fg.deobf('dev.emi:emi-forge:1.1.24+1.20.1')
    } else if (compatViewer == 'rei') {
        runtimeOnly fg.deobf('me.shedaniel:RoughlyEnoughItems-forge:12.1.785')
        // REI declares these only in mods.toml, so Gradle does not pull them
        // transitively for the development run configuration.
        runtimeOnly fg.deobf('dev.architectury:architectury-forge:9.0.7')
        runtimeOnly fg.deobf('me.shedaniel.cloth:cloth-config-forge:11.0.99')
    } else if (compatViewer != 'none') {
        throw new GradleException("Unknown compatViewer '${compatViewer}'; use none, jei, emi, or rei")
    }
}

mixin {
    add sourceSets.main, 'glitchedcrown.refmap.json'
    config 'glitchedcrown.mixins.json'
}

processResources {
    def replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            forge_version           : forge_version,
            forge_version_range     : forge_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'             : 'glitchedcrown.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
