plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
}

version = mod_version
group = mod_group_id

base { archivesName = "${mod_id}-neoforge-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets.main.resources.srcDir('src/generated/resources')

sourceSets {
    jeiStubs { java.srcDir 'src/jeiStubs/java' }
    emiStubs { java.srcDir 'src/emiStubs/java' }
    reiStubs { java.srcDir 'src/reiStubs/java' }
}
sourceSets.jeiStubs.compileClasspath += configurations.compileClasspath
sourceSets.emiStubs.compileClasspath += configurations.compileClasspath
sourceSets.reiStubs.compileClasspath += configurations.compileClasspath
sourceSets.main.compileClasspath += sourceSets.jeiStubs.output
sourceSets.main.compileClasspath += sourceSets.emiStubs.output
sourceSets.main.compileClasspath += sourceSets.reiStubs.output
tasks.named('compileJava').configure {
    dependsOn tasks.named('compileJeiStubsJava'), tasks.named('compileEmiStubsJava'), tasks.named('compileReiStubsJava')
}

repositories { maven { url = 'https://maven.theillusivec4.top/' } }

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client { client(); systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id }
        server { server(); programArgument '--nogui'; systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}

configurations { runtimeClasspath.extendsFrom localRuntime }
dependencies {
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description
    ]
    inputs.properties(replaceProperties)
    expand(replaceProperties)
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask(generateModMetadata)
tasks.named('processResources', ProcessResources).configure {
    // The preserved 1.20.1 asset tree is rooted at `thecrowns/`; NeoForge expects it below
    // `assets/thecrowns/` in both the development resources output and the release JAR.
    exclude 'thecrowns/**'
    from('src/main/resources/thecrowns') { into 'assets/thecrowns' }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
